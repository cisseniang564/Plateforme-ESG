<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0e2330"/>
      <stop offset="100%" stop-color="#060f1a"/>
    </linearGradient>
    <linearGradient id="leaf" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#4ade80"/>
      <stop offset="40%"  stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="white" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect width="64" height="32" rx="16" fill="url(#shine)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none"
        stroke="rgba(16,185,129,0.18)" stroke-width="1"/>
  <path d="M 14 52 C 8 44, 10 28, 22 18 C 30 10, 42 8, 50 12 C 58 16, 58 30, 50 42 C 44 50, 30 56, 14 52 Z"
        fill="url(#leaf)" filter="url(#glow)"/>
  <path d="M 14 52 Q 32 32 50 12"
        stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <circle cx="50" cy="12" r="3" fill="rgba(255,255,255,0.28)"/>
</svg>
