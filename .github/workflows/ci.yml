name: CI — Tests & Lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  # ─── Backend Tests ──────────────────────────────────────────────────────
  backend-tests:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: esgflow_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: esgflow_test
          DATABASE_USER: test
          DATABASE_PASSWORD: test
          # conftest.py impose sinon une base nommée « test » qui n'existe pas dans le service Postgres
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/esgflow_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          # Settings exige APP_ENV in (development|staging|production) et des clés >= 32 caractères
          SECRET_KEY: ci-secret-key-at-least-32-characters-long
          JWT_SECRET_KEY: ci-jwt-secret-key-at-least-32-characters
          ENCRYPTION_KEY: ci-encryption-key-at-least-32-chars-xx
          APP_ENV: development
        run: pytest tests/ -v --tb=short --no-header

  # ─── Frontend Tests ─────────────────────────────────────────────────────
  frontend-tests:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test -- --run

      - name: Build
        run: npm run build

  # ─── Lint ───────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python linters
        run: pip install black==23.12.1 isort==5.13.2 flake8==7.0.0

      # Non bloquant : 189 fichiers sur 212 ne sont pas encore au format black.
      # Retirer continue-on-error après un commit de formatage unique (black + isort).
      - name: Check Python formatting (black)
        continue-on-error: true
        run: black --check backend/app/

      - name: Check Python imports (isort)
        continue-on-error: true
        run: isort --check-only backend/app/

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: ESLint
        run: npm run lint
        working-directory: frontend

  # ─── E2E Tests (Playwright) ─────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: esgflow_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Start backend API
        working-directory: backend
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: esgflow_test
          DATABASE_USER: test
          DATABASE_PASSWORD: test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          # Sans REDIS_URL, l'API cherche Redis sur l'hôte « redis » (valeur de la prod) : limitation de débit et blocage inactifs
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: e2e-ci-secret-key-32-chars-min!!
          JWT_SECRET_KEY: e2e-ci-jwt-secret-key-32-chars!!
          ENCRYPTION_KEY: e2e-ci-encryption-key-32-chars-min!!
          S3_ACCESS_KEY_ID: ci
          S3_SECRET_ACCESS_KEY: ci
          APP_ENV: development
          APP_URL: http://127.0.0.1:3000
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/api.log 2>&1 &
          # Attend que l'API réponde (jusqu'à 90 s) au lieu d'un « sleep 5 » : le démarrage crée toutes les tables
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          echo "L'API n'a pas démarré :"; tail -50 /tmp/api.log; exit 1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Serve frontend (relais /api vers l'API)
        working-directory: frontend
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 3000 --strictPort > /tmp/front.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/ > /dev/null && exit 0
            sleep 1
          done
          echo "Le site n'a pas démarré :"; cat /tmp/front.log; exit 1

      - name: Install Playwright browsers
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        env:
          BASE_URL: http://127.0.0.1:3000
          API_URL: http://127.0.0.1:8000
          CI: true
        # Le projet « bruteforce » dépend du projet « chromium » : tout est exécuté, les tests de blocage en dernier
        run: npx playwright test --project=bruteforce

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
