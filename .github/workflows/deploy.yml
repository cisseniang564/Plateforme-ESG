name: Deploy to Production

# Deploy ONLY after CI passes on main — prevents broken code reaching production.
on:
  workflow_run:
    workflows: ["CI — Tests & Lint"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    # Gate: CI must have succeeded (not cancelled or failed)
    if: ${{ github.event.workflow_run.conclusion == 'success' && secrets.SSH_HOST != '' }}

    steps:
      - name: Checkout at the commit that triggered CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # ── Build frontend ────────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npx vite build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      # ── Setup SSH key ─────────────────────────────────────────────────────────
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      # ── Copy files to server ──────────────────────────────────────────────────
      - name: Rsync backend source to server
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude="__pycache__" \
            --exclude="*.pyc" \
            --exclude=".pytest_cache" \
            backend/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/esgflow/backend/

      - name: Rsync frontend dist to server
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            frontend/dist/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/esgflow/frontend/dist/

      # ── Hotpatch containers ───────────────────────────────────────────────────
      - name: Hotpatch backend + restart
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
          set -e
          COMMIT="${{ github.event.workflow_run.head_sha }}"
          echo "=== Deploying commit ${COMMIT:0:8} ==="

          BACKEND=$(docker ps --format '{{.Names}}' \
            | grep -iE 'backend' | grep -viE 'celery|beat|worker' | head -1 || true)

          if [ -n "$BACKEND" ]; then
            echo "Hotpatching $BACKEND..."
            docker cp /opt/esgflow/backend/app/. "$BACKEND":/app/app/
            docker restart "$BACKEND"

            # Copy frontend dist into nginx container
            NGINX=$(docker ps --format '{{.Names}}' | grep -iE 'nginx' | head -1 || true)
            if [ -n "$NGINX" ]; then
              docker cp /opt/esgflow/frontend/dist/. "$NGINX":/usr/share/nginx/html/
              echo "Frontend updated in $NGINX"
            fi

            # Update celery workers
            for WORKER in $(docker ps --format '{{.Names}}' | grep -iE 'celery|beat' || true); do
              echo "Patching worker: $WORKER"
              docker cp /opt/esgflow/backend/app/. "$WORKER":/app/app/
              docker restart "$WORKER"
            done
          else
            echo "No backend container found — full compose up..."
            cd /opt/esgflow
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
          fi

          echo "=== Deploy finished: $(date) ==="
          ENDSSH

      # ── Health check & rollback guard ─────────────────────────────────────────
      - name: Health check (30s window)
        run: |
          echo "Waiting for backend to come up..."
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            https://${{ secrets.SSH_HOST }}/api/health || echo "000")
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "307" ]; then
            echo "::error::Health check failed (HTTP $STATUS). Manual rollback required."
            exit 1
          fi
          echo "Backend healthy."

      # ── Notify on success ─────────────────────────────────────────────────────
      - name: Deployment summary
        if: success()
        run: |
          echo "✅ Deployed commit ${{ github.event.workflow_run.head_sha }} to production"
          echo "   Server: ${{ secrets.SSH_HOST }}"
          echo "   Time:   $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
