name: Deploy frontend

# Déploiement du site (frontend) sur le serveur IONOS.
# - automatique à chaque push sur main qui touche frontend/
# - ou à la main : onglet Actions > "Deploy frontend" > Run workflow
# Le serveur installe l'archive avec sauvegarde et retour arrière automatique.
on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la configuration
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          [ -n "$SSH_HOST" ] && [ -n "$SSH_PRIVATE_KEY" ] || { echo "::error::Secrets SSH_HOST / SSH_PRIVATE_KEY manquants"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Tests et build
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: |
          npm ci
          npx vitest run
          npx vite build

      - name: Préparer l'archive
        run: tar czf site.tgz -C frontend dist

      - name: Envoyer au serveur (déploiement)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ci_key && chmod 600 ~/.ssh/ci_key
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" | sed "s/^HOTE/$SSH_HOST/" > ~/.ssh/known_hosts
            OPTS="-o StrictHostKeyChecking=yes"
          else
            echo "::warning::SSH_KNOWN_HOSTS absent : empreinte du serveur non vérifiée"
            OPTS="-o StrictHostKeyChecking=accept-new"
          fi
          ssh -i ~/.ssh/ci_key $OPTS "${SSH_USER:-root}@$SSH_HOST" < site.tgz
